# AJAX endpoint: sets the order status to "Shipped" (PS_OS_SHIPPING).
# Called from the admin order page and the Geodis shipment page.
# PS 9 prefixes module routes with /modules.
axelweb_awgeodisorderlink_ajax_update_state_order:
  path: /awgeodisorderlink/ajax-update-state-order
  methods: [POST]
  defaults:
    _controller: 'Axelweb\AwGeodisOrderLink\Controller\AwGeodisOrderLinkController::ajaxUpdateStateOrder'
    _legacy_controller: AdminOrders
